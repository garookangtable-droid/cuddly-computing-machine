<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매장 급여 계산기</title>
<style>
/* 매장별 탭 → 직원 표 → 선택한 직원의 달력 입력. 숫자는 모두 고정폭 숫자로 정렬 */
:root {
  --bg: #F4F3EF;
  --surface: #FFFFFF;
  --sunken: #ECEAE4;
  --ink: #1B1D1F;
  --muted: #6B6E72;
  --line: #DCD9D2;
  --accent: #0E6E5C;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEFEA;
  --prob: #FFF1D6;
  --prob-ink: #8A5A00;
  --warn: #B3261E;
  --warn-soft: #FBE4E2;
  --radius: 10px;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1C1F22; --sunken: #262A2E; --ink: #EDEDEA; --muted: #9EA3A8;
    --line: #33383D; --accent: #4CC2A6; --accent-ink: #0B1512; --accent-soft: #173A33;
    --prob: #3A2E14; --prob-ink: #F2C46B; --warn: #FF8A80; --warn-soft: #3B1D1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1C1F22; --sunken: #262A2E; --ink: #EDEDEA; --muted: #9EA3A8;
  --line: #33383D; --accent: #4CC2A6; --accent-ink: #0B1512; --accent-soft: #173A33;
  --prob: #3A2E14; --prob-ink: #F2C46B; --warn: #FF8A80; --warn-soft: #3B1D1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 18px 16px 56px; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; padding-bottom: 14px; border-bottom: 3px solid var(--accent); }
.brand h1 { font-size: 24px; letter-spacing: -0.01em; }
.brand p { color: var(--muted); font-size: 13px; }
.month { display: flex; align-items: center; gap: 6px; }
.month input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; }
.iconbtn { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 16px 0; background: var(--sunken); padding: 4px; border-radius: 999px; width: fit-content; max-width: 100%; }
.tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--warn); }
.btn.primary.danger { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile .label { color: var(--muted); font-size: 13px; }
.tile .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tile.hero .label { color: inherit; opacity: .85; }
.tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile.hero .sub { color: inherit; opacity: .85; }

/* Panels & tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.panel-head h2 { font-size: 17px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
td b { white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
tfoot td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; }
tbody tr.pick { cursor: pointer; }
tbody tr.pick:hover { background: var(--sunken); }
tbody tr.sel { background: var(--accent-soft); }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); font-weight: 600; white-space: nowrap; }
.badge.full { background: var(--accent-soft); color: var(--accent); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.empty .row { justify-content: center; margin-top: 12px; }

/* Editor */
.ed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.ed-head h2 { font-size: 19px; }
.ed-head .row { margin-left: auto; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
.pattern { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; max-width: 520px; }
.pattern label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); text-align: center; }
.pattern input { width: 100%; padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); text-align: center; }
.cal { min-width: 640px; table-layout: fixed; }
.cal th { text-align: center; }
.cal td { padding: 4px; vertical-align: top; border: 1px solid var(--line); }
.cal td.wk { background: var(--sunken); font-size: 13px; text-align: right; vertical-align: middle; padding: 4px 8px; }
.cal .d { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.cal input { width: 100%; padding: 5px 4px; border: 1px solid transparent; border-radius: 6px; background: var(--bg); text-align: center; font-variant-numeric: tabular-nums; }
.cal input:focus { border-color: var(--accent); }
.cal input[type="checkbox"] { width: auto; padding: 0; margin: 0; }
.cal input.has { background: var(--accent-soft); font-weight: 700; }
.cal input.bad { border-color: var(--warn); background: var(--warn-soft); }
.cal td.other { opacity: .5; }
.cal td.prob { background: var(--prob); }
.cal td.prob .d { color: var(--prob-ink); }
.cal td.out { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--sunken) 6px 8px); }
.cal td.out input { visibility: hidden; }
.cal td.sun .d span:first-child { color: var(--warn); }
.cal td.hol { background: var(--warn-soft); }
.cal .d .hn { color: var(--warn); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; }
.hol-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 16px; margin: 10px 0; }
.hol-list label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.hol-list .off { text-decoration: line-through; color: var(--muted); }
.juhu-ok { color: var(--accent); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }

.breakdown { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
@media (max-width: 760px) { .breakdown { grid-template-columns: minmax(0, 1fr); } }
.calc { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.calc h3 { font-size: 14px; margin-bottom: 6px; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.line:last-child { border-bottom: 0; }
.line .how { font-size: 12px; color: var(--muted); }
.line.total { font-weight: 800; font-size: 17px; border-top: 2px solid var(--ink); border-bottom: 0; margin-top: 4px; padding-top: 8px; }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-top: 10px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input.bad, .field select.bad { border-color: var(--warn); background: var(--warn-soft); }
.field input, .field select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: 100%; }
.adj { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.adj input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: right; }

/* Dialog & settings */
dialog { max-height: calc(100dvh - 32px); overflow: auto; border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 18px; display: grid; gap: 12px; }
dialog h2 { font-size: 18px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.seg { display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 10px; }
.seg label { flex: 1; text-align: center; padding: 6px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.settings { display: grid; gap: 16px; }
.notice { font-size: 13px; color: var(--muted); line-height: 1.7; }
.notice li { margin-bottom: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); z-index: 10; }
@media print {
  .tabs, .month, .no-print, .btn, .iconbtn { display: none !important; }
  body { background: #fff; color: #000; }
  .panel, .tile { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>매장 급여 계산기</h1>
      <p>알바 주휴수당 · 정직원 수습 일할계산 · 추가근무 1.5배 · <span id="saveStatus">이 브라우저에 저장</span></p>
    </div>
    <div class="month">
      <button class="iconbtn" id="prevM" aria-label="이전 달">‹</button>
      <input type="month" id="month" aria-label="급여 월">
      <button class="iconbtn" id="nextM" aria-label="다음 달">›</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="storageWarn" class="warn" hidden>이 브라우저에서는 데이터가 저장되지 않습니다. 설정 탭의 "백업 파일 저장"으로 꼭 보관하세요.</div>
  <main id="view"></main>
</div>

<dialog id="askDlg">
  <form method="dialog" id="askForm">
    <p id="askMsg" style="font-weight:600"></p>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn" id="askNo">취소</button>
      <button type="button" class="btn primary" id="askYes">확인</button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<dialog id="empDlg">
  <form id="empForm" method="dialog" novalidate>
    <h2 id="empDlgTitle">직원 추가</h2>
    <div class="seg" role="radiogroup" aria-label="구분">
      <label><input type="radio" name="type" value="part" checked>알바 (시급)</label>
      <label><input type="radio" name="type" value="full">정직원 (월급)</label>
    </div>
    <div class="grid2">
      <label class="field"><span>이름</span><input name="name" required autocomplete="off"></label>
      <label class="field"><span>매장</span><select name="store"></select></label>
    </div>
    <div class="grid2" data-for="part">
      <label class="field"><span>시급 (원)</span><input name="hourly" type="number" min="0" step="any" inputmode="numeric"></label>
    </div>
    <div class="grid2" data-for="full">
      <label class="field"><span>월 기본급 (원)</span><input name="monthly" type="number" min="0" step="any" inputmode="numeric"></label>
      <label class="field"><span>수습 지급률 (%)</span><input name="probRate" type="number" min="0" max="100" step="any" value="90"></label>
    </div>
    <div class="grid2">
      <label class="field"><span>입사일</span><input name="hire" type="date"></label>
      <label class="field"><span>퇴사일 (마지막 근무일)</span><input name="leave" type="date"></label>
    </div>
    <div class="grid2" data-for="full">
      <label class="field"><span>수습 기간 (최대 3개월)</span><select name="probMonths">
        <option value="0">수습 없음</option><option value="1">1개월</option><option value="2">2개월</option><option value="3">3개월</option><option value="custom">날짜 직접 입력</option></select></label>
      <label class="field"><span>수습 종료일 (이날까지 수습)</span><input name="probEnd" type="date"></label>
    </div>
    <p id="empErr" class="warn" hidden></p>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn" id="empCancel">취소</button>
      <button type="button" class="btn primary" id="empSave">저장</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'store-payroll-v1';
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

// ---------- 날짜 도우미 (모두 로컬 날짜 'YYYY-MM-DD' 문자열로 다룸) ----------
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => { const t = new Date(y, m - 1, d); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const dowOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
const addDays = (k, n) => { const [y, m, d] = k.split('-').map(Number); return ymd(y, m, d + n); };
const r1 = n => Math.round(n * 100) / 100;
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const hrs = n => r1(n).toLocaleString('ko-KR') + '시간';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------- 공휴일 (우주항공청 월력요항 기준, 대체·임시공휴일 포함) ----------
const KR_HOLIDAYS = {
  '2025-01-01': '신정', '2025-01-27': '임시공휴일', '2025-01-28': '설날 연휴', '2025-01-29': '설날', '2025-01-30': '설날 연휴',
  '2025-03-01': '삼일절', '2025-03-03': '대체공휴일(삼일절)', '2025-05-05': '어린이날·부처님오신날', '2025-05-06': '대체공휴일',
  '2025-06-03': '대통령선거', '2025-06-06': '현충일', '2025-08-15': '광복절', '2025-10-03': '개천절',
  '2025-10-05': '추석 연휴', '2025-10-06': '추석', '2025-10-07': '추석 연휴', '2025-10-08': '대체공휴일(추석)', '2025-10-09': '한글날', '2025-12-25': '성탄절',
  '2026-01-01': '신정', '2026-02-16': '설날 연휴', '2026-02-17': '설날', '2026-02-18': '설날 연휴',
  '2026-03-01': '삼일절', '2026-03-02': '대체공휴일(삼일절)', '2026-05-01': '노동절', '2026-05-05': '어린이날',
  '2026-05-24': '부처님오신날', '2026-05-25': '대체공휴일(부처님오신날)', '2026-06-03': '지방선거', '2026-06-06': '현충일',
  '2026-07-17': '제헌절', '2026-08-15': '광복절', '2026-08-17': '대체공휴일(광복절)',
  '2026-09-24': '추석 연휴', '2026-09-25': '추석', '2026-09-26': '추석 연휴',
  '2026-10-03': '개천절', '2026-10-05': '대체공휴일(개천절)', '2026-10-09': '한글날', '2026-12-25': '성탄절',
  '2027-01-01': '신정', '2027-02-06': '설날 연휴', '2027-02-07': '설날', '2027-02-08': '설날 연휴', '2027-02-09': '대체공휴일(설날)',
  '2027-03-01': '삼일절', '2027-05-01': '노동절', '2027-05-03': '대체공휴일(노동절)', '2027-05-05': '어린이날', '2027-05-13': '부처님오신날',
  '2027-06-06': '현충일', '2027-07-17': '제헌절', '2027-07-19': '대체공휴일(제헌절)', '2027-08-15': '광복절', '2027-08-16': '대체공휴일(광복절)',
  '2027-09-14': '추석 연휴', '2027-09-15': '추석', '2027-09-16': '추석 연휴',
  '2027-10-03': '개천절', '2027-10-04': '대체공휴일(개천절)', '2027-10-09': '한글날', '2027-10-11': '대체공휴일(한글날)',
  '2027-12-25': '성탄절', '2027-12-27': '대체공휴일(성탄절)'
};
function holidayName(k) {
  const H = state.holidays || {};
  if (H.removed && H.removed[k]) return '';
  return (H.added && H.added[k]) || KR_HOLIDAYS[k] || '';
}
// 알바 1.5배 대상: 월~금에 있는 공휴일 (주말 공휴일은 제외)
const isPremiumDay = k => { const d = dowOf(k); return d !== 0 && d !== 6 && !!holidayName(k); };
function holidaysOfYear(y) {
  const H = state.holidays || {}, keys = new Set([...Object.keys(KR_HOLIDAYS), ...Object.keys(H.added || {})]);
  return [...keys].filter(k => k.startsWith(y + '-')).sort()
    .map(k => ({ k, name: (H.added && H.added[k]) || KR_HOLIDAYS[k], off: !!(H.removed && H.removed[k]), custom: !!(H.added && H.added[k]) && !KR_HOLIDAYS[k] }));
}
// 캘린더 앱에서 내보낸 .ics 파일의 종일 일정을 공휴일로 읽음
function parseIcs(txt) {
  const out = {}, lines = txt.replace(/\r?\n[ \t]/g, '').split(/\r?\n/);
  let ev = null;
  for (const l of lines) {
    if (l === 'BEGIN:VEVENT') ev = {};
    else if (l === 'END:VEVENT' && ev) {
      if (ev.start) {
        let k = ev.start; const end = ev.end && ev.end > ev.start ? ev.end : addDays(ev.start, 1);
        for (let i = 0; k < end && i < 10; i++, k = addDays(k, 1)) out[k] = ev.name || '공휴일';
      }
      ev = null;
    } else if (ev) {
      const m = l.match(/^(DTSTART|DTEND|SUMMARY)[^:]*:(.*)$/);
      if (!m) continue;
      if (m[1] === 'SUMMARY') ev.name = m[2].replace(/\\,/g, ',').replace(/\\n/g, ' ').trim();
      else { const d = m[2].match(/^(\d{4})(\d{2})(\d{2})/); if (d) ev[m[1] === 'DTSTART' ? 'start' : 'end'] = `${d[1]}-${d[2]}-${d[3]}`; }
    }
  }
  return out;
}

// claude.ai에 올린 페이지로 열면 내 계정(본인만 보는 영역)에 저장. 근무기록은 연도별 문서로 나눔
const cloud = { db: null, dir: null, dl: null, last: {}, writing: false, again: false, timer: 0 };
const setStatus = t => { const el = document.getElementById('saveStatus'); if (el) el.textContent = t; };
function toDocs(st) {
  const docs = { core: { v: 1, stores: st.stores, employees: st.employees, excl: st.excl, adj: st.adj, holidays: st.holidays, settings: st.settings } };
  for (const [id, H] of Object.entries(st.hours)) for (const [k, v] of Object.entries(H)) {
    const y = 'h-' + k.slice(0, 4); ((docs[y] ||= {})[id] ||= {})[k] = v;
  }
  return docs;
}
function fromDocs(docs) {
  const f = fresh(), c = docs.core;
  const st = { ...f, stores: c.stores || f.stores, employees: c.employees || [], excl: c.excl || {}, adj: c.adj || {}, holidays: c.holidays || f.holidays, settings: { ...f.settings, ...c.settings }, hours: {} };
  for (const [name, body] of Object.entries(docs)) if (name.startsWith('h-'))
    for (const [id, H] of Object.entries(body)) Object.assign((st.hours[id] ||= {}), H);
  return st;
}
async function flushCloud() {
  if (!cloud.db) return;
  if (cloud.writing) { cloud.again = true; return; }
  cloud.writing = true; setStatus('저장 중…');
  try {
    const docs = toDocs(state);
    for (const id of new Set([...Object.keys(docs), ...Object.keys(cloud.last)])) {
      const j = docs[id] ? JSON.stringify(docs[id]) : null;
      if (j === cloud.last[id]) continue;
      const ref = cloud.db.collection(cloud.dir).doc(id);
      if (j === null) { await ref.delete(); delete cloud.last[id]; }
      else { await ref.set(docs[id]); cloud.last[id] = j; }
    }
    setStatus('내 계정에 저장됨');
  } catch (e) {
    if (e && e.code === 'quota_exceeded') setStatus('저장 공간이 가득 찼습니다. 오래된 기록을 백업 후 지워 주세요.');
    else if (e && e.code === 'unavailable') { setStatus('저장 재시도 중…'); setTimeout(flushCloud, 4000); }
    else setStatus('계정 저장 실패 · 이 브라우저에만 저장됨');
  } finally {
    cloud.writing = false;
    if (cloud.again) { cloud.again = false; flushCloud(); }
  }
}
async function initCloud() {
  if (!window.claude || !window.claude.use) return;
  document.querySelectorAll('[data-act="print"]').forEach(b => b.hidden = true);
  document.documentElement.classList.add('in-claude');
  claude.use('downloads').then(d => { cloud.dl = d; }).catch(() => {});
  try {
    const [d, u] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = u ? await u.id() : null;
    if (!d || !id) return;
    cloud.dir = 'data/users/' + id;
    setStatus('계정에서 불러오는 중…');
    const snap = await d.collection(cloud.dir).get();
    const docs = {};
    for (const x of snap.docs) if (x.exists) { docs[x.id] = x.data(); cloud.last[x.id] = JSON.stringify(x.data()); }
    cloud.db = d;
    if (docs.core) { state = fromDocs(docs); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} render(); setStatus('내 계정에 저장됨'); }
    else await flushCloud();
  } catch (e) { setStatus('이 브라우저에 저장'); }
}

// ---------- 계산 ----------
function employedIn(emp, y, m) {
  const a = ymd(y, m, 1), b = ymd(y, m, daysIn(y, m));
  return (!emp.hire || emp.hire <= b) && (!emp.leave || emp.leave >= a);
}

// 알바: 이번 달 근무시간 × 시급 + 이번 달에 끝나는 주의 주휴수당
function calcPart(emp, y, m) {
  const S = state.settings, H = state.hours[emp.id] || {}, ex = state.excl[emp.id] || {};
  const D = daysIn(y, m), rate = +emp.hourly || 0;
  let hours = 0, days = 0, holH = 0;
  const holDays = [];
  for (let d = 1; d <= D; d++) {
    const k = ymd(y, m, d), h = +H[k] || 0;
    if (h > 0) { hours += h; days++; if (isPremiumDay(k)) { holH += h; holDays.push({ k, h, name: holidayName(k) }); } }
  }
  const endDow = (S.weekStart + 6) % 7, weeks = [];
  for (let d = 1; d <= D; d++) {
    const end = ymd(y, m, d);
    if (dowOf(end) !== endDow) continue;
    const start = addDays(end, -6);
    let wh = 0;
    for (let i = 0; i < 7; i++) wh += +H[addDays(start, i)] || 0;
    const w = { start, end, hours: wh, jh: 0, pay: 0, note: '' };
    if (ex[end]) w.note = '제외';
    else if (!wh) w.note = '근무 없음';
    else if (wh < 15) w.note = '15시간 미만';
    else if (emp.leave && emp.leave <= end) w.note = '퇴사 주';
    else { w.jh = Math.min(wh, 40) / 40 * 8; w.pay = Math.round(w.jh * rate); }
    weeks.push(w);
  }
  const base = Math.round(hours * rate);
  const juhu = weeks.reduce((s, w) => s + w.pay, 0);
  const hol = Math.round(holH * rate * (S.holRate - 1));  // 기본급에 이미 1배가 들어 있으므로 가산분만
  const adj = +((state.adj[emp.id] || {})[`${y}-${pad(m)}`]) || 0;
  const warns = [];
  if (rate && rate < S.minWage) warns.push(`시급 ${won(rate)}이 최저임금 ${won(S.minWage)}보다 낮습니다.`);
  return { type: 'part', hours, days, rate, weeks, base, juhu, holH, holDays, ot: hol, otHours: holH, adj, total: base + juhu + hol + adj, warns };
}

// 정직원: 월급 ÷ 해당 월 일수(28~31일)로 일할, 수습일은 지급률 적용. 추가근무 = 시간 × 통상시급 × 1.5
function calcFull(emp, y, m) {
  const S = state.settings, H = state.hours[emp.id] || {};
  const D = daysIn(y, m), M = +emp.monthly || 0;
  const p = (emp.probRate ?? 90) / 100, daily = M / D, std = M / S.stdHours;
  let nDays = 0, pDays = 0, otH = 0, otHp = 0, otPay = 0;
  for (let d = 1; d <= D; d++) {
    const k = ymd(y, m, d), st = dayStatus(emp, k);
    if (st === 'work') nDays++; else if (st === 'prob') pDays++;
    const h = st === 'out' ? 0 : (+H[k] || 0);
    if (h) { otH += h; if (st === 'prob') otHp += h; otPay += h * std * (st === 'prob' ? p : 1) * S.otRate; }
  }
  const baseN = Math.round(daily * nDays), baseP = Math.round(daily * p * pDays);
  const ot = Math.round(otPay);
  const adj = +((state.adj[emp.id] || {})[`${y}-${pad(m)}`]) || 0;
  const warns = [];
  if (M && std < S.minWage) warns.push(`통상시급 ${won(std)}(월급 ÷ ${S.stdHours}시간)이 최저임금 ${won(S.minWage)}보다 낮습니다.`);
  if (pDays && std * p < S.minWage) {
    warns.push(`수습 시급 ${won(std * p)}이 최저임금보다 낮습니다. 최저임금 90% 감액은 1년 이상 계약·단순노무직 아님·수습 3개월 이내일 때만 가능합니다.`);
    if (emp.hire && emp.probEnd && emp.probEnd > addMonths(emp.hire, 3)) warns.push('수습 종료일이 입사 후 3개월을 넘습니다. 3개월 이후에는 최저임금 감액이 허용되지 않습니다.');
  }
  return { type: 'full', D, M, p, daily, std, nDays, pDays, baseN, baseP, base: baseN + baseP, otHours: otH, otHp, ot, juhu: 0, hours: 0, adj, total: baseN + baseP + ot + adj, warns };
}
function addMonths(k, n) { const [y, m, d] = k.split('-').map(Number); return ymd(y, m + n, d - 1); }
function dayStatus(emp, k) {
  if ((emp.hire && k < emp.hire) || (emp.leave && k > emp.leave)) return 'out';
  if (emp.type === 'full' && emp.probEnd && k <= emp.probEnd) return 'prob';
  return 'work';
}
const calc = (emp, y = ui.y, m = ui.m) => emp.type === 'full' ? calcFull(emp, y, m) : calcPart(emp, y, m);
const staffOf = storeId => state.employees.filter(e => e.store === storeId && employedIn(e, ui.y, ui.m));
function sumOf(list) {
  const t = { part: 0, full: 0, partN: 0, fullN: 0, base: 0, juhu: 0, ot: 0, hol: 0, otF: 0, adj: 0, total: 0 };
  for (const e of list) {
    const c = calc(e);
    if (e.type === 'full') { t.full += c.total; t.fullN++; } else { t.part += c.total; t.partN++; }
    t.base += c.base; t.juhu += c.juhu; t.ot += c.ot; if (e.type === 'full') t.otF += c.ot; else t.hol += c.ot; t.adj += c.adj; t.total += c.total;
  }
  return t;
}

function renderCal(e, order) {
  const H = state.hours[e.id] || {}, full = e.type === 'full', S = state.settings;
  const first = ymd(ui.y, ui.m, 1), last = ymd(ui.y, ui.m, daysIn(ui.y, ui.m));
  let k = addDays(first, -((dowOf(first) - S.weekStart + 7) % 7));
  const rows = [];
  while (k <= last) {
    let cells = '';
    const wkStart = k;
    for (let i = 0; i < 7; i++, k = addDays(k, 1)) {
      const inM = k >= first && k <= last, day = +k.slice(8), dw = dowOf(k);
      if (full && !inM) { cells += '<td class="other"></td>'; continue; }
      const st = dayStatus(e, k), v = H[k];
      const hn = holidayName(k), prem = !full && isPremiumDay(k);
      const cls = [!inM && 'other', full && st === 'prob' && 'prob', full && st === 'out' && 'out', (dw === 0 || hn) && 'sun', prem && 'hol'].filter(Boolean).join(' ');
      const tag = hn ? `<span class="hn" title="${esc(hn)}${prem ? ` · ${S.holRate}배` : dw === 0 || dw === 6 ? ' · 주말이라 가산 없음' : ''}">${prem ? '×' + S.holRate : esc(hn.replace(/\(.*\)/, ''))}</span>` : full && st === 'prob' ? '<span>수습</span>' : '';
      cells += `<td class="${cls}"${hn ? ` title="${esc(hn)}"` : ''}><div class="d"><span>${inM ? day : `${+k.slice(5, 7)}/${day}`}</span>${tag}</div>
        <input data-day="${k}" inputmode="decimal" aria-label="${k}" value="${v ? r1(v) : ''}" class="${v ? 'has' : ''}" ${full && st === 'out' ? 'disabled' : ''}></td>`;
    }
    const wkEnd = addDays(wkStart, 6);
    rows.push(`<tr>${cells}<td class="wk" data-wk="${wkStart}"></td>${full ? '' : `<td class="wk" data-jh="${wkEnd}"></td>`}</tr>`);
  }
  $('#calBody').innerHTML = rows.join('');
  updateWeeks(e);
}

function updateWeeks(e) {
  const H = state.hours[e.id] || {}, full = e.type === 'full';
  const last = ymd(ui.y, ui.m, daysIn(ui.y, ui.m)), first = ymd(ui.y, ui.m, 1);
  const c = full ? null : calcPart(e, ui.y, ui.m);
  document.querySelectorAll('#calBody [data-wk]').forEach(td => {
    let s = 0;
    for (let i = 0; i < 7; i++) { const k = addDays(td.dataset.wk, i); if (!full || (k >= first && k <= last)) s += +H[k] || 0; }
    td.textContent = s ? hrs(s) : '–';
  });
  if (full) return;
  const ex = state.excl[e.id] || {};
  document.querySelectorAll('#calBody [data-jh]').forEach(td => {
    const end = td.dataset.jh, w = c.weeks.find(x => x.end === end);
    if (end > last) { td.innerHTML = '<span class="muted small">다음 달 정산</span>'; return; }
    if (end < first) { td.innerHTML = '<span class="muted small">지난 달 정산</span>'; return; }
    const box = `<label class="small muted no-print" style="display:inline-flex;align-items:center;gap:4px;margin-top:2px;cursor:pointer"><input type="checkbox" data-excl="${end}" ${ex[end] ? 'checked' : ''}>제외</label>`;
    td.innerHTML = (w.pay ? `<span class="juhu-ok">${won(w.pay)}</span><div class="small muted">${r1(w.jh)}시간분</div>` : `<span class="muted small">${w.note}</span>`) + box;
  });
}

const dlg = $('#empDlg'), form = $('#empForm');
let editing = null;
function syncType() {
  const t = form.type.value;
  form.querySelectorAll('[data-for]').forEach(x => x.hidden = x.dataset.for !== t);
}
function openEmp(e) {
  editing = e || null;
  $('#empDlgTitle').textContent = e ? '직원 정보 수정' : '직원 추가';
  form.store.innerHTML = state.stores.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  form.reset();
  const v = e || { type: 'part', store: state.stores.some(s => s.id === ui.tab) ? ui.tab : 's1', hourly: state.settings.minWage, probRate: 90 };
  form.type.value = v.type; form.name.value = v.name || ''; form.store.value = v.store;
  form.hourly.value = v.hourly ?? ''; form.monthly.value = v.monthly ?? ''; form.probRate.value = v.probRate ?? 90;
  form.hire.value = v.hire || ''; form.leave.value = v.leave || ''; form.probEnd.value = v.probEnd || '';
  form.probMonths.value = v.probMonths ?? guessProbMonths(v);
  syncProb();
  $('#empErr').hidden = true;
  syncType(); dlg.showModal(); form.name.focus();
}
// 예전에 저장된 직원은 수습 종료일로 개월 수를 추정
function guessProbMonths(v) {
  if (!v.probEnd) return '0';
  for (const n of [1, 2, 3]) if (v.hire && addMonths(v.hire, n) === v.probEnd) return String(n);
  return 'custom';
}
// 1~3개월을 고르면 입사일 기준으로 종료일을 채우고, 종료일을 직접 고치면 '직접 입력'으로 바뀜
function syncProb() {
  const pm = form.probMonths.value;
  if (pm === '0') form.probEnd.value = '';
  else if (pm !== 'custom' && form.hire.value) form.probEnd.value = addMonths(form.hire.value, +pm);
  form.probEnd.disabled = pm === '0';
}
form.addEventListener('change', ev => {
  const n = ev.target.name;
  if (n === 'type') syncType();
  else if (n === 'probMonths' || n === 'hire') {
    if (n === 'probMonths' && !['0', 'custom'].includes(form.probMonths.value) && !form.hire.value) { $('#empErr').textContent = '입사일을 먼저 입력하면 종료일이 자동으로 채워집니다.'; $('#empErr').hidden = false; }
    else $('#empErr').hidden = true;
    syncProb();
  } else if (n === 'probEnd') form.probMonths.value = form.probEnd.value ? guessProbMonths({ hire: form.hire.value, probEnd: form.probEnd.value }) : '0';
});
$('#empCancel').addEventListener('click', () => dlg.close());
// 저장은 버튼 클릭으로 처리 (폼 제출에 기대지 않음). 문제가 있으면 해당 칸을 빨갛게 표시하고 그 칸으로 이동
form.addEventListener('submit', ev => { ev.preventDefault(); saveEmp(); });
$('#empSave').addEventListener('click', () => saveEmp());
form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); saveEmp(); } });
form.addEventListener('input', ev => ev.target.classList.remove('bad'));
function saveEmp() {
  const t = form.type.value, err = $('#empErr');
  form.querySelectorAll('.bad').forEach(x => x.classList.remove('bad'));
  const fail = (m, field) => {
    err.textContent = m; err.hidden = false;
    if (field) { field.classList.add('bad'); field.focus(); }
    err.scrollIntoView({ block: 'nearest' });
  };
  if (!form.name.value.trim()) return fail('이름을 입력하세요.', form.name);
  if (t === 'part' && !(+form.hourly.value > 0)) return fail('시급을 숫자로 입력하세요.', form.hourly);
  if (t === 'full' && !(+form.monthly.value > 0)) return fail('월 기본급을 숫자로 입력하세요 (예: 2800000).', form.monthly);
  if (t === 'full' && form.probMonths.value !== '0' && !(+form.probRate.value > 0 && +form.probRate.value <= 100)) return fail('수습 지급률은 1~100 사이 숫자로 입력하세요 (예: 90).', form.probRate);
  if (form.hire.value && form.leave.value && form.leave.value < form.hire.value) return fail('퇴사일이 입사일보다 빠릅니다.', form.leave);
  if (t === 'full' && form.probMonths.value !== '0') {
    if (!form.hire.value && form.probMonths.value !== 'custom') return fail('수습 기간을 계산하려면 입사일을 입력하세요. 입사일을 넣으면 수습 종료일이 자동으로 채워집니다.', form.hire);
    if (!form.probEnd.value) return fail('수습 종료일을 입력하세요.', form.probEnd);
    if (form.hire.value && form.probEnd.value < form.hire.value) return fail('수습 종료일이 입사일보다 빠릅니다.', form.probEnd);
    if (form.hire.value && form.probEnd.value > addMonths(form.hire.value, 3)) return fail(`수습은 최대 3개월입니다. 종료일은 ${addMonths(form.hire.value, 3)}까지 정할 수 있습니다.`, form.probEnd);
  }
  const e = editing || { id: uid() };
  Object.assign(e, {
    type: t, name: form.name.value.trim(), store: form.store.value,
    hourly: t === 'part' ? +form.hourly.value : undefined,
    monthly: t === 'full' ? +form.monthly.value : undefined,
    probRate: t === 'full' ? (form.probRate.value === '' ? 90 : +form.probRate.value) : undefined,
    probEnd: t === 'full' && form.probMonths.value !== '0' ? form.probEnd.value || '' : '',
    probMonths: t === 'full' ? form.probMonths.value : undefined,
    hire: form.hire.value || '', leave: form.leave.value || ''
  });
  if (!editing) state.employees.push(e);
  save(); dlg.close();
  ui.tab = e.store; ui.sel = e.id; saveUi(); render();
}

// ---------- 확인 창 / 알림 (브라우저 기본 confirm·alert 대신) ----------
function ask(msg, yes = '확인') {
  const d = $('#askDlg');
  $('#askMsg').textContent = msg; $('#askYes').textContent = yes;
  $('#askYes').classList.toggle('danger', yes !== '확인');
  return new Promise(res => {
    const done = v => { d.close(); res(v); };
    $('#askForm').onsubmit = ev => { ev.preventDefault(); done(true); };
    $('#askYes').onclick = () => done(true);
    $('#askNo').onclick = () => done(false);
    d.oncancel = () => res(false);
    d.showModal(); $('#askNo').focus();
  });
}
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// ---------- 입력 처리 ----------
function parseHours(s) {
  s = String(s).trim().replace(/\s/g, '');
  if (!s) return 0;
  const m = s.match(/^(\d{1,2})(?::(\d{2}))?[-~](\d{1,2})(?::(\d{2}))?$/);
  if (m) {
    const a = +m[1] * 60 + +(m[2] || 0); let b = +m[3] * 60 + +(m[4] || 0);
    if (b <= a) b += 24 * 60;
    return r1((b - a) / 60);
  }
  const n = Number(s.replace(',', '.'));
  return Number.isFinite(n) && n >= 0 && n <= 24 ? n : NaN;
}
function afterEdit() { save(); renderSummary(); const e = state.employees.find(x => x.id === ui.sel); if (e) updateWeeks(e); renderBreakdown(); }

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.day) {
    const v = parseHours(t.value), H = (state.hours[ui.sel] ||= {});
    if (Number.isNaN(v)) { t.classList.add('bad'); return; }
    t.classList.remove('bad');
    if (v) H[t.dataset.day] = v; else delete H[t.dataset.day];
    t.value = v ? r1(v) : ''; t.classList.toggle('has', !!v);
    afterEdit();
  } else if (t.dataset.excl) {
    const x = (state.excl[ui.sel] ||= {});
    if (t.checked) x[t.dataset.excl] = true; else delete x[t.dataset.excl];
    afterEdit();
  } else if ('adj' in t.dataset) {
    const a = (state.adj[ui.sel] ||= {}), k = `${ui.y}-${pad(ui.m)}`, v = Math.round(Number(t.value.replace(/[,\s원]/g, '')) || 0);
    if (v) a[k] = v; else delete a[k];
    afterEdit();
  } else if (t.dataset.pat !== undefined) {
    const e = state.employees.find(x => x.id === ui.sel), v = parseHours(t.value);
    (e.pattern ||= {})[t.dataset.pat] = Number.isNaN(v) ? 0 : v; t.value = v || ''; save();
  } else if (t.dataset.store) {
    const s = state.stores.find(x => x.id === t.dataset.store); s.name = t.value.trim() || s.name; save(); renderTabs();
  } else if (t.dataset.set) {
    const v = Number(t.value); if (Number.isFinite(v) && v >= 0) { state.settings[t.dataset.set] = v; save(); }
  } else if (t.dataset.hol) {
    const H = (state.holidays ||= { added: {}, removed: {} }); H.removed ||= {};
    if (t.checked) delete H.removed[t.dataset.hol]; else H.removed[t.dataset.hol] = true;
    save(); renderSettings();
  } else if (t.id === 'icsFile' && t.files[0]) {
    t.files[0].text().then(txt => {
      const got = parseIcs(txt), n = Object.keys(got).length; t.value = '';
      if (!n) { toast('캘린더 파일에서 날짜를 찾지 못했습니다.'); return; }
      const H = (state.holidays ||= { added: {}, removed: {} }); H.added ||= {};
      let added = 0;
      for (const [k, name] of Object.entries(got)) if (!KR_HOLIDAYS[k] && !H.added[k]) { H.added[k] = name; added++; }
      save(); renderSettings(); toast(`캘린더에서 ${n}일을 읽었고, 새 공휴일 ${added}일을 추가했습니다.`);
    });
  } else if (t.id === 'importFile' && t.files[0]) {
    t.files[0].text().then(async txt => {
      let s;
      try { s = JSON.parse(txt); if (!Array.isArray(s.employees)) throw 0; }
      catch (e) { toast('올바른 백업 파일이 아닙니다.'); t.value = ''; return; }
      t.value = '';
      if (!await ask('현재 데이터를 백업 파일 내용으로 바꿉니다. 계속할까요?', '바꾸기')) return;
      const f = fresh(); state = { ...f, ...s, settings: { ...f.settings, ...s.settings } }; save(); render(); toast('백업을 불러왔습니다.');
    });
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.dataset?.day) {
    ev.preventDefault();
    const all = [...document.querySelectorAll('#calBody input[data-day]:not(:disabled)')], i = all.indexOf(ev.target);
    ev.target.blur(); (all[i + 1] || ev.target).focus();
  } else if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset?.emp) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('focusin', ev => { if (ev.target.dataset?.day) ev.target.select(); });

document.addEventListener('click', async ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; ui.sel = null; saveUi(); render(); return; }
  const row = ev.target.closest('tr[data-emp]');
  if (row) {
    const e = state.employees.find(x => x.id === row.dataset.emp);
    if (ui.tab !== e.store) { ui.tab = e.store; ui.sel = e.id; saveUi(); render(); }
    else { ui.sel = e.id; saveUi(); renderSummary(); renderEditor(); }
    $('#editor')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const act = ev.target.closest('[data-act]')?.dataset.act; if (!act) return;
  const e = state.employees.find(x => x.id === ui.sel);
  if (act === 'add') openEmp();
  else if (act === 'edit') openEmp(e);
  else if (act === 'del') {
    if (!await ask(`${e.name} 님과 모든 근무 기록을 삭제할까요?`, '삭제')) return;
    state.employees = state.employees.filter(x => x !== e);
    delete state.hours[e.id]; delete state.excl[e.id]; delete state.adj[e.id];
    ui.sel = null; save(); render();
  } else if (act === 'fill' || act === 'clear') {
    const H = (state.hours[e.id] ||= {}), P = e.pattern || {};
    if (act === 'clear' && !await ask(`${ui.m}월 입력을 모두 지울까요?`, '비우기')) return;
    for (let d = 1; d <= daysIn(ui.y, ui.m); d++) {
      const k = ymd(ui.y, ui.m, d);
      if (act === 'clear') { delete H[k]; continue; }
      if (dayStatus(e, k) === 'out') continue;
      const v = +P[dowOf(k)] || 0; if (v) H[k] = v; else delete H[k];
    }
    save(); renderSummary(); renderEditor();
  } else if (act === 'csv') downloadCsv();
  else if (act === 'print') window.print();
  else if (act === 'export') download(`급여계산_백업_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(state, null, 2), 'application/json');
  else if (act === 'reset') {
    if (!await ask('모든 직원과 근무 기록을 지웁니다. 먼저 백업하셨나요?', '전체 삭제')) return;
    state = fresh(); save(); ui.tab = 's1'; ui.sel = null; render(); toast('초기화했습니다.');
  }
  else if (act === 'demo') demo();
  else if (act === 'holPrev' || act === 'holNext') { ui.y += act === 'holPrev' ? -1 : 1; render(); }
  else if (act === 'holAdd') {
    const k = $('#holDate').value, name = $('#holName').value.trim() || '공휴일';
    if (!k) { toast('날짜를 선택하세요.'); return; }
    const H = (state.holidays ||= { added: {}, removed: {} }); (H.added ||= {})[k] = name; if (H.removed) delete H.removed[k];
    save(); ui.y = +k.slice(0, 4); render(); toast(`${k} ${name}을(를) 추가했습니다.`);
  } else if (act === 'holDel') {
    const k = ev.target.closest('[data-k]').dataset.k; delete state.holidays.added[k]; save(); renderSettings();
  }
});

async function download(name, text, type) {
  if (window.claude) {
    if (!cloud.dl) { toast('이 화면에서는 파일 저장을 쓸 수 없습니다.'); return; }
    try { await cloud.dl.save({ filename: name, data: text }); toast('파일을 저장했습니다.'); }
    catch (e) { if (e && e.code !== 'declined') toast('파일을 저장하지 못했습니다.'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadCsv() {
  const stores = ui.tab === 'all' ? state.stores : state.stores.filter(s => s.id === ui.tab);
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['매장', '이름', '구분', '근무시간', '근무일수', '수습일수', '기본급', '주휴수당', '추가·공휴일 시간', '추가·공휴일 수당', '기타', '지급합계']];
  for (const s of stores) for (const e of staffOf(s.id)) {
    const c = calc(e);
    rows.push([s.name, e.name, e.type === 'full' ? '정직원' : '알바', e.type === 'full' ? '' : r1(c.hours), e.type === 'full' ? c.nDays + c.pDays : c.days, e.type === 'full' ? c.pDays : '',
      c.base, c.juhu, r1(c.otHours), c.ot, c.adj, c.total]);
  }
  const tot = rows.slice(1).reduce((t, r) => t.map((v, i) => i >= 6 && i !== 8 ? v + r[i] : v), ['합계', '', '', '', '', '', 0, 0, '', 0, 0, 0]);
  rows.push(tot);
  const name = ui.tab === 'all' ? '전체' : stores[0].name;
  download(`급여_${name}_${ui.y}-${pad(ui.m)}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

function demo() {
  const y = ui.y, m = ui.m, mk = (dy, dm = 0) => ymd(y, m + dm, dy);
  const E = [
    { id: uid(), type: 'part', name: '김민지', store: 's1', hourly: 10320, hire: mk(1, -6), pattern: { 1: 5, 3: 5, 5: 5 } },
    { id: uid(), type: 'part', name: '이서준', store: 's1', hourly: 10500, hire: mk(1, -2), pattern: { 6: 6, 0: 6 } },
    { id: uid(), type: 'full', name: '박지훈', store: 's1', monthly: 2500000, probRate: 90, hire: mk(16, -2), probEnd: addMonths(mk(16, -2), 3) },
    { id: uid(), type: 'part', name: '최유나', store: 's2', hourly: 10320, hire: mk(1, -3), pattern: { 1: 4, 2: 4, 3: 4, 4: 4, 5: 4 } },
    { id: uid(), type: 'full', name: '정하늘', store: 's2', monthly: 2800000, probRate: 90, hire: mk(10), probEnd: addMonths(mk(10), 3) }
  ];
  for (const e of E) {
    state.employees.push(e);
    const H = (state.hours[e.id] = {});
    if (e.type === 'part') {
      for (let d = -6; d <= daysIn(y, m); d++) { const k = mk(d); if (k >= e.hire) { const v = e.pattern[dowOf(k)]; if (v) H[k] = v; } }
    } else { H[mk(15)] = 2; H[mk(22)] = 1.5; H[mk(27)] = 3; }
  }
  save(); ui.tab = 's1'; ui.sel = E[0].id; render();
}

$('#month').addEventListener('change', ev => { const [y, m] = ev.target.value.split('-').map(Number); if (y && m) { ui.y = y; ui.m = m; render(); } });
const shift = n => { const d = new Date(ui.y, ui.m - 1 + n, 1); ui.y = d.getFullYear(); ui.m = d.getMonth() + 1; render(); };
$('#prevM').addEventListener('click', () => shift(-1));
$('#nextM').addEventListener('click', () => shift(1));

render();
initCloud();
</script>
