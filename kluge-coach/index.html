<title>클루지 관계 코치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 왼쪽 상황 입력, 오른쪽 분석 결과 (휴대폰에서는 위아래).
   검은 바탕에 선명한 주황 한 가지. 주황 = 반사하는 옛 뇌, 흰색 = 생각하는 새 뇌 */
:root {
  --bg: #0A0A0A;
  --surface: #151515;
  --sunken: #212121;
  --ink: #F6F4F0;
  --muted: #A29D96;
  --line: #2F2F2F;
  --accent: #FF6A00;
  --accent-ink: #0A0A0A;
  --reflex: #FF6A00;
  --reflex-soft: #2B1505;
  --reason: #F6F4F0;
  --reason-soft: #262626;
  --warn: #FFC23D;
  --warn-soft: #2A2109;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-quote: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --step--1: 0.82rem;
  --step-0: 0.95rem;
  --step-1: 1.15rem;
  --step-2: 1.45rem;
  --step-3: 2.1rem;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.65; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 4px solid var(--accent); }
.brand h1 { font-size: var(--step-3); font-weight: 400; letter-spacing: 0; }
.brand h1 em { font-style: normal; color: var(--accent); }
.brand p { color: var(--muted); font-size: var(--step--1); margin-top: 2px; }
.brand .two { color: var(--reflex); }
.brand .two + .two { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* Main grid */
.grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; margin-top: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Form */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.form { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .form { position: static; } }
.form h2 { font-size: var(--step-1); }
.field { display: grid; gap: 5px; }
.field label { font-weight: 600; font-size: var(--step--1); }
.field .hint { color: var(--muted); font-size: var(--step--1); font-weight: 400; }
textarea, select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; resize: vertical; }
textarea { min-height: 70px; }
#situation { min-height: 110px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: var(--step--1); cursor: pointer; color: var(--ink); }
.chip:hover { border-color: var(--accent); }
.mode { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.mode label { position: relative; cursor: pointer; }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode span { display: block; height: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font-weight: 600; }
.mode small { display: block; font-weight: 400; color: var(--muted); font-size: var(--step--1); line-height: 1.4; }
.mode input:checked + span { border-color: var(--accent); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--accent); }
.mode input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.heat { display: grid; gap: 4px; }
.heat-row { display: flex; align-items: center; gap: 10px; }
.heat input { flex: 1; accent-color: var(--reflex); }
.heat output { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 5.5em; text-align: right; font-size: var(--step--1); }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); padding: 11px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
.btn:not(.ghost):not(:disabled):hover { filter: brightness(1.1); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 5px 11px; font-size: var(--step--1); font-weight: 500; }
.note { color: var(--muted); font-size: var(--step--1); }
.privacy { border-top: 1px dashed var(--line); padding-top: 10px; }

/* Result */
.result { display: grid; gap: 18px; min-width: 0; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: var(--step--1); color: var(--muted); }
.tag { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: var(--step--1); font-weight: 600; }
.tag.example { background: var(--warn-soft); color: var(--warn); }
.tag.saved { background: var(--reason-soft); color: var(--reason); }
.summary { font-weight: 600; font-size: var(--step-2); line-height: 1.5; border-left: 6px solid var(--accent); padding-left: 14px; }
.sec { display: grid; gap: 12px; }
.sec > h3 { font-size: var(--step-1); display: flex; align-items: baseline; gap: 10px; }
.sec > h3 small { font-family: var(--font-body); font-size: var(--step--1); color: var(--muted); font-weight: 400; }
.sec.mirror { background: var(--surface); border: 2px solid var(--accent); box-shadow: 6px 6px 0 var(--reflex-soft); border-radius: var(--radius); padding: 18px; }
.sec.mirror > h3 { color: var(--reflex); }

.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); } }
.facts > div { background: var(--sunken); border-radius: 8px; padding: 12px 14px; }
.facts h4 { margin: 0 0 4px; font-size: var(--step--1); letter-spacing: .04em; color: var(--muted); }
ul.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }

.err { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.facts + .err { border-top: 0; }
.err-name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.err-name .en { color: var(--muted); font-weight: 400; font-size: var(--step--1); }
.quote { border-left: 3px solid var(--reflex); padding: 2px 0 2px 10px; color: var(--ink); font-style: italic; }
.reframe { background: var(--reason-soft); border-radius: 6px; padding: 8px 11px; }
.reframe b { color: var(--reason); }
.err .why { color: var(--muted); }
.noerr { color: var(--muted); }

/* Two brains */
.brains { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.scarf { display: grid; grid-template-columns: minmax(5.5em, auto) minmax(0, 1fr) minmax(0, 1fr); gap: 6px 12px; align-items: center; font-size: var(--step--1); }
.scarf .hd { color: var(--muted); font-weight: 600; }
.meter { display: flex; gap: 3px; }
.meter span { height: 10px; flex: 1; max-width: 46px; border-radius: 3px; background: var(--sunken); }
.meter.me span.on { background: var(--reflex); }
.meter.them span.on { background: var(--ink); }
.scarf .dom b { display: block; font-size: var(--step-0); }
.scarf .dom span { color: var(--muted); }
.kluge { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
@media (max-width: 560px) { .kluge { grid-template-columns: minmax(0, 1fr); } }
.kluge h4 { margin: 0 0 4px; font-size: var(--step--1); }
.kluge .me h4 { color: var(--reflex); }
.kluge .them h4 { color: var(--ink); }

.scarf.one { grid-template-columns: minmax(5.5em, auto) minmax(0, 1fr); }
.kluge.one { grid-template-columns: minmax(0, 1fr); }
.alarm { display: grid; grid-template-columns: minmax(7em, auto) minmax(0, 1fr); gap: 10px 12px; align-items: center; font-size: var(--step--1); }
.alarm .dom b { display: block; font-size: var(--step-0); }
.alarm .dom span { color: var(--muted); }
.alarm-why { margin-top: 12px; }
.halt { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.halt h4 { margin: 0; font-size: var(--step--1); color: var(--reflex); }
.halt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.verdict { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 600; }
.verdict.now { background: var(--reason-soft); color: var(--reason); }
.verdict.wait { background: var(--reflex-soft); color: var(--reflex); }
.verdict.info { background: var(--warn-soft); color: var(--warn); }
.monologue { font-family: var(--font-quote); font-size: var(--step-1); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; line-height: 1.7; }
.monologue::before { content: "“"; color: var(--accent); font-size: 1.6em; line-height: 0; vertical-align: -0.3em; margin-right: 2px; }
.gap { border-left: 3px solid var(--accent); padding-left: 12px; }

.control { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .control { grid-template-columns: minmax(0, 1fr); } }
.control > div { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.control h4 { margin: 0 0 4px; font-size: var(--step--1); }
.control .yes h4 { color: var(--reason); }
.control .no h4 { color: var(--muted); }
.lens { color: var(--muted); }
.lens b { color: var(--ink); }

.dodont { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .dodont { grid-template-columns: minmax(0, 1fr); } }
.dodont > div { border-radius: 8px; padding: 12px 14px; }
.dodont .dont { background: var(--reflex-soft); }
.dodont .do { background: var(--reason-soft); }
.dodont h4 { margin: 0 0 4px; font-size: var(--step--1); }
.dodont .dont h4 { color: var(--reflex); }
.dodont .do h4 { color: var(--reason); }
.timing { font-size: var(--step--1); }
.timing b { color: var(--ink); }
.scripts { display: grid; gap: 10px; }
.script { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.script .when { font-size: var(--step--1); color: var(--muted); }
.script .line { font-size: var(--step-1); }
.script-foot { display: flex; justify-content: flex-end; }
.boundary { background: var(--sunken); border-radius: 8px; padding: 12px 14px; }
.caution { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 12px 14px; }
.caution b { color: var(--warn); }

/* Loading / pause */
.state { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.breath { width: 120px; height: 120px; border-radius: 50%; background: var(--reflex-soft); border: 3px solid var(--accent); display: grid; place-items: center; font-variant-numeric: tabular-nums; font-size: var(--step-2); font-family: var(--font-display); color: var(--accent); animation: breathe 10s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.82); } 40% { transform: scale(1.05); } 60% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) { .breath { animation: none; } }
.state p { max-width: 44ch; }
.state .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.err-box { background: var(--reflex-soft); border-radius: 8px; padding: 12px 14px; }

/* Follow-up chat */
.chat { display: grid; gap: 10px; }
.msg { border-radius: 8px; padding: 10px 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { background: var(--sunken); justify-self: end; max-width: 90%; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); }
.chat-form { display: flex; gap: 8px; align-items: end; }
.chat-form textarea { min-height: 48px; }

/* Outcome */
.outcome textarea { min-height: 60px; }
.outcome .row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }

/* History */
.hist-head { display: grid; gap: 10px; margin-bottom: 14px; }
.habits { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.habit { background: var(--reflex-soft); color: var(--reflex); border-radius: 999px; padding: 3px 11px; font-size: var(--step--1); font-weight: 600; font-variant-numeric: tabular-nums; }
.hist { display: grid; gap: 8px; }
.hist-item { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: grid; gap: 3px; }
.hist-item:hover { border-color: var(--accent); }
.hist-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.hist-row .hist-item { min-width: 0; }
.del { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.del-btn { color: var(--muted); }
.del-btn:hover { color: var(--reflex); border-color: var(--reflex); }
.btn.danger { background: var(--reflex); color: var(--accent-ink); }
.banner-del { margin-left: auto; }
@media (max-width: 560px) { .hist-row { grid-template-columns: minmax(0, 1fr); } .hist-row .del { justify-content: flex-start; } }
.hist-item .meta { font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; }
.hist-item .sum { font-weight: 500; }
.empty { color: var(--muted); padding: 20px 0; }

/* Library */
.lib { display: grid; gap: 28px; margin-top: 20px; }
.lib section { display: grid; gap: 12px; }
.lib h2 { font-size: var(--step-2); }
.lib .lead { color: var(--muted); max-width: 70ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.card h3 { font-size: var(--step-1); }
.card .en { color: var(--muted); font-size: var(--step--1); }
.card .k { font-size: var(--step--1); color: var(--muted); }
.card .k b { color: var(--ink); }
.twobrain { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .twobrain { grid-template-columns: minmax(0, 1fr); } }
.twobrain > div { border-radius: 8px; padding: 14px 16px; }
.twobrain .old { background: var(--reflex-soft); }
.twobrain .new { background: var(--reason-soft); }
.twobrain h3 { font-size: var(--step-1); margin-bottom: 4px; }
.twobrain .old h3 { color: var(--reflex); }
.twobrain .new h3 { color: var(--reason); }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><em>클루지</em> 관계 코치</h1>
      <p><span class="two">반사하는 옛 뇌</span>와 <span class="two">생각하는 새 뇌</span> 사이에서, 상대의 마음과 내 마음을 함께 봅니다</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="화면">
      <button role="tab" id="tab-new" aria-selected="true" data-view="new">새 상황</button>
      <button role="tab" id="tab-hist" aria-selected="false" data-view="hist">기록</button>
      <button role="tab" id="tab-lib" aria-selected="false" data-view="lib">지식 카드</button>
    </nav>
  </header>

  <main id="view-new" class="grid">
    <form class="panel form" id="form" autocomplete="off">
      <div class="mode" role="radiogroup" aria-label="무엇을 점검할까요">
        <label><input type="radio" name="mode" id="mode-rel" value="rel" checked><span>관계 상황<small>다른 사람과 있었던 일</small></span></label>
        <label><input type="radio" name="mode" id="mode-solo" value="solo"><span>나 혼자 점검<small>기분, 불안, 내리려는 결정</small></span></label>
      </div>
      <h2 id="form-title">무슨 일이 있었나요?</h2>
      <div class="field">
        <span class="note">예시로 채워보기</span>
        <div class="presets" id="presets"></div>
      </div>
      <div class="field" id="rel-field">
        <label for="rel">상대와의 관계</label>
        <select id="rel">
          <option>직원</option><option>동료·동업자</option><option>거래처·고객</option><option>친구·지인</option>
          <option>가족</option><option>연인·배우자</option><option>기타</option>
        </select>
      </div>
      <div class="field">
        <label for="situation">상황 <span class="hint">· 있었던 일을 최대한 그대로</span></label>
        <textarea id="situation" required placeholder="누가, 언제, 무슨 말이나 행동을 했나요?"></textarea>
      </div>
      <div class="field">
        <label for="feeling">내 감정 <span class="hint">· 솔직하게</span></label>
        <textarea id="feeling" placeholder="화남, 서운함, 배신감, 불안…"></textarea>
      </div>
      <div class="field">
        <label for="guess">내가 생각하는 상대의 속마음 <span class="hint">· 짐작이어도 괜찮아요</span></label>
        <textarea id="guess" placeholder="저 사람은 왜 저랬을까요?"></textarea>
      </div>
      <div class="field">
        <label for="want">지금 하고 싶은 반응</label>
        <textarea id="want" placeholder="솔직히 지금 당장 하고 싶은 말이나 행동"></textarea>
      </div>
      <div class="field heat">
        <label for="heat">감정 온도</label>
        <div class="heat-row">
          <input type="range" id="heat" min="1" max="5" step="1" value="3">
          <output id="heat-out" for="heat">3 · 불편함</output>
        </div>
      </div>
      <button class="btn" id="go" type="submit">분석하기</button>
      <p class="note" id="avail-note" hidden></p>
      <p class="note privacy">실명 대신 이니셜(A, B…)을 쓰는 걸 권해요. 기록은 나만 볼 수 있게 저장됩니다.</p>
    </form>

    <section class="result" id="result" aria-live="polite"></section>
  </main>

  <main id="view-hist" hidden>
    <div class="hist-head" style="margin-top:20px">
      <h2 style="font-size:var(--step-2)">지난 상황들</h2>
      <div class="habits" id="habits"></div>
    </div>
    <div class="hist" id="hist"></div>
  </main>

  <main id="view-lib" class="lib" hidden></main>
</div>

<script>
/* ---------- 지식 베이스 ---------- */
const BIASES = [
  { id: "fundamental_attribution", name: "기본적 귀인 오류", en: "Fundamental attribution error",
    desc: "남의 행동은 성격 탓으로, 내 행동은 상황 탓으로 설명한다.",
    origin: "상대를 빨리 '좋은 사람/위험한 사람'으로 분류해야 살아남던 시절의 지름길. 상황 정보를 모으는 건 비싸고 느렸다.",
    antidote: "'저 사람이 어떤 상황이었다면 나도 저렇게 했을까?'를 물어본다." },
  { id: "mind_reading", name: "독심술", en: "Mind reading",
    desc: "확인하지 않은 상대의 의도를 사실처럼 단정한다.",
    origin: "타인의 의도를 미리 짐작하는 능력은 집단생활의 핵심 무기였지만, 정확도보다 속도에 맞춰져 있다.",

const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false || c === "") continue;
    el.append(c.nodeType ? c : String(c));
  }
  return el;
}

const store = {
  mode: "memory", items: [], listeners: [], col: null,
  async init() {
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const uid = user ? await user.id() : null;
      if (db && uid) {
        this.col = db.collection("data/users/" + uid);
        this.mode = "db";
        this.col.orderBy("createdAt", "desc").limit(300).onSnapshot(
          snap => { this.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); this.emit(); },
          () => { this.mode = "local"; this.loadLocal(); }
        );
        return;
      }
    } catch {}
    this.mode = "local"; this.loadLocal();
  },
  loadLocal() {
    try { this.items = JSON.parse(localStorage.getItem("kluge-records") || "[]"); } catch { this.items = []; }
    this.emit();
  },
  saveLocal() { try { localStorage.setItem("kluge-records", JSON.stringify(this.items.slice(0, 200))); } catch {} },
  emit() { this.listeners.forEach(f => f(this.items)); },
  async add(rec) {
    const id = "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    if (this.mode === "db") { await this.col.doc(id).set(rec); }
    else { this.items.unshift({ id, ...rec }); this.saveLocal(); this.emit(); }
    return id;
  },
  async patch(id, data) {
    if (this.mode === "db") { await this.col.doc(id).update(data); }
    else { const it = this.items.find(i => i.id === id); if (it) Object.assign(it, data); this.saveLocal(); this.emit(); }
  },
  async remove(id) {
    if (this.mode === "db") { await this.col.doc(id).delete(); }
    else { this.items = this.items.filter(i => i.id !== id); this.saveLocal(); this.emit(); }
  }
};

[상태] ${inp.situation}
[감정] ${inp.feeling} / [머릿속 생각] ${inp.guess} / [내리려는 판단] ${inp.want}
[앞서 한 분석 요약] ${str(r.summary)} 판단: ${str((r.decision || {}).verdict)} ${str((r.decision || {}).reason)}`
      : `너는 클루지(진화적으로 덧대어진 뇌), 뇌과학, 심리학, 철학에 밝은 인간관계 코치다. 아첨하지 말고, 필요하면 사용자의 생각 오류도 짚어라. 짧고 구체적인 한국어로 답하라. 마크다운 기호는 쓰지 마라.
[상황] 관계: ${inp.rel} / ${inp.situation}
[사용자 감정] ${inp.feeling} / [사용자의 짐작] ${inp.guess} / [하고 싶은 반응] ${inp.want}
[앞서 한 분석 요약] ${str(r.summary)} 입장 차이: ${str(r.gap)} 지켜야 할 선: ${str(r.boundary)}`;
    try {
      const { text } = await sampleFn([{ role: "user", content: context }, ...turns.slice(-10)], {
        cache: false, onText: ({ text }) => { bubble.textContent = text; }
      });
      turns.push({ role: "assistant", content: text });
      draw();
      if (opts.recordId) store.patch(opts.recordId, { chat: turns.slice(-20) }).catch(() => {});

let runId = 0; // 다른 화면으로 넘어가면 진행 중이던 분석 결과가 화면을 덮지 않도록

function showPause(heat, onDone) {
  const root = $("#result");
  let left = 90;
  const count = h("div", { class: "breath", text: String(left) });
  const skip = h("button", { class: "btn ghost", type: "button", text: "바로 결과 보기" });
  root.replaceChildren(h("div", { class: "state" },
    h("h3", { text: `감정 온도 ${heat}/5, 옛 뇌가 운전대를 잡고 있어요` }),
    count,
    h("p", { text: "강한 감정의 화학 반응은 약 90초면 한 번 가라앉아요. 원이 커질 때 들이쉬고, 작아질 때 천천히 내쉬세요. 그동안 분석은 뒤에서 진행돼요." }),
    h("div", { class: "row" }, skip)));
  const timer = setInterval(() => { left--; count.textContent = String(left); if (left <= 0) finish(); }, 1000);
  let done = false;
  function finish() { if (done) return; done = true; clearInterval(timer); onDone(); }
  skip.addEventListener("click", finish);
}

function showLoading(onStop) {
  const started = Date.now();
  const el = h("span", { text: "0초" });
  const stop = h("button", { class: "btn ghost", type: "button", text: "멈추기" });
  stop.addEventListener("click", onStop);
  $("#result").replaceChildren(h("div", { class: "state" },
    h("h3", { text: "옛 뇌와 새 뇌를 나눠 보는 중" }),
    h("p", {}, "보통 20초에서 1분쯤 걸려요. ", el, " 지남"),
    h("div", { class: "row" }, stop)));
  const t = setInterval(() => { el.textContent = Math.round((Date.now() - started) / 1000) + "초"; }, 1000);
  return () => clearInterval(t);
}

function showError(msg) {
  $("#result").replaceChildren(h("div", { class: "err-box", text: msg }));
}

async function analyze(inp) {
  if (!sampleFn) return;
  currentRecordId = null;
  showingExample = false;
  ctl?.abort();
  ctl = new AbortController();
  const signal = ctl.signal;
  const go = $("#go");
  go.disabled = true;

  const job = sampleFn.json(buildPrompt(inp), { signal, modelTier: "default" });
  let paused = inp.heat >= 4;
  let outcome = null;
  let stopTimer = null;

  const myRun = ++runId;
  const reveal = async () => {
    if (myRun !== runId) { stopTimer?.(); go.disabled = false; return; }
    if (paused) return;
    if (!outcome) { stopTimer = showLoading(() => ctl.abort()); return; }
    stopTimer?.();
    go.disabled = false;
    if (outcome.error) {
      if (outcome.error.code === "cancelled") showError("분석을 멈췄어요.");
      else showError(errCopy(outcome.error));
      return;
    }
    const r = outcome.result;
    let recordId = null;
    const createdAt = Date.now();
    try { recordId = await store.add({ createdAt, input: inp, result: r, outcome: "", chat: [] }); } catch {}
    renderResult(r, inp, { recordId, when: createdAt });
    $("#result").scrollIntoView({ behavior: "smooth", block: "start" });
  };

  if (paused) showPause(inp.heat, () => { paused = false; reveal(); });
  else reveal();

  try {
    const r = await job;
    if (!r || typeof r !== "object" || !r.summary) throw { code: "invalid_json" };
    outcome = { result: r };
  } catch (e) { outcome = { error: e }; }
  if (!paused) reveal();
}

  }
  items.forEach(it => {
    const inp = it.input || {}, r = it.result || {};
    const btn = h("button", { class: "hist-item", type: "button" },
      h("span", { class: "meta", text: `${fmtDate(it.createdAt)} · ${inp.mode === "solo" ? "나 혼자 점검" : str(inp.rel)} · 온도 ${inp.heat || "-"}/5${it.outcome ? " · 회고 있음" : ""}` }),
      h("span", { class: "sum", text: str(r.summary) || str(inp.situation).slice(0, 80) }));
    btn.addEventListener("click", () => {
      runId++; ctl?.abort();

      $("#result").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    list.append(h("div", { class: "hist-row" }, btn, deleteControl(it.id)));
  });
  // 생각 습관 패턴
  const counts = {};
  items.forEach(it => arr(it.result && it.result.myErrors).forEach(e => { if (e && e.id) counts[e.id] = (counts[e.id] || 0) + 1; }));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const habits = $("#habits");
  habits.replaceChildren();
  if (top.length) {
    habits.append(h("span", { class: "note", text: "내가 자주 빠지는 생각 습관" }));
    top.forEach(([id, n]) => habits.append(h("span", { class: "habit", text: `${(BIAS_MAP[id] || { name: id }).name} ${n}회` })));
  }
}

function deleteControl(id, onDeleted) {
  const box = h("div", { class: "del" });
  const idle = () => {
    const b = h("button", { class: "btn ghost small del-btn", type: "button", text: "삭제", "aria-label": "이 기록 삭제" });
    b.addEventListener("click", ask);
    box.replaceChildren(b);
  };
  const ask = () => {
    const yes = h("button", { class: "btn small danger", type: "button", text: "삭제" });
    const no = h("button", { class: "btn ghost small", type: "button", text: "취소" });
    no.addEventListener("click", idle);
    yes.addEventListener("click", async () => {
      yes.disabled = no.disabled = true;
      try {
        await store.remove(id);
        if (currentRecordId === id) {
          currentRecordId = null;
          showExample(currentMode());
        }
        onDeleted?.();
      } catch {
        box.replaceChildren(h("span", { class: "note", text: "삭제하지 못했어요. 다시 눌러주세요." }));
        setTimeout(idle, 2500);

    box.replaceChildren(h("span", { class: "note", text: "되돌릴 수 없어요." }), yes, no);
  };
  idle();
  return box;
}

        h("div", { class: "old" }, h("h3", { text: "옛 뇌 (반사 시스템)" }), h("p", { text: "빠르고 자동적이며 감정적입니다. 위협, 서열, 공정성, 소속을 순식간에 감지합니다. 편도체가 중심이며, 오경보가 많지만 놓치는 법은 적습니다." })),
        h("div", { class: "new" }, h("h3", { text: "새 뇌 (숙고 시스템)" }), h("p", { text: "느리고 의식적이며 에너지가 많이 듭니다. 전전두엽이 중심입니다. 피곤하거나 화가 나면 가장 먼저 꺼집니다. 그래서 중요한 대화는 감정이 가라앉은 뒤에 하는 게 좋습니다." })))),
    h("section", {},
      h("h2", { text: "SCARF: 사회적 위협의 다섯 가지" }),
      h("p", { class: "lead", text: "신경과학자 데이비드 록이 정리한 모델입니다. 뇌는 아래 다섯 가지가 위협받을 때 몸이 다칠 때와 비슷한 경보를 울립니다." }),
      h("div", { class: "cards" }, SCARF.map(s => h("div", { class: "card" }, h("h3", { text: s.name }), h("p", { text: s.desc }))))),
    h("section", {},
      h("h2", { text: "생각 오류 카드" }),
      h("p", { class: "lead", text: "분석에서 짚어주는 생각 오류의 전체 목록입니다. 진화적으로는 이유가 있었지만, 오늘의 관계에서는 자주 빗나갑니다." }),
      h("div", { class: "cards" }, BIASES.map(b => h("div", { class: "card" },
        h("h3", { text: b.name }), h("span", { class: "en", text: b.en }),
        h("p", { text: b.desc }),
        h("p", { class: "k" }, h("b", { text: "왜 생겼나 " }), b.origin),
        h("p", { class: "k" }, h("b", { text: "해독제 " }), b.antidote))))),
    h("section", {},
      h("h2", { text: "철학의 렌즈" }),
      h("div", { class: "cards" }, LENSES.map(l => h("div", { class: "card" }, h("h3", { text: l.name }), h("span", { class: "en", text: l.who }), h("p", { text: l.idea })))))
  );
}

/* ---------- 폼, 탭 ---------- */
const MODE_TEXT = {
  rel: {
    title: "무슨 일이 있었나요?",
    situation: ["상황", "있었던 일을 최대한 그대로", "누가, 언제, 무슨 말이나 행동을 했나요?"],
    feeling: ["내 감정", "솔직하게", "화남, 서운함, 배신감, 불안…"],
    guess: ["내가 생각하는 상대의 속마음", "짐작이어도 괜찮아요", "저 사람은 왜 저랬을까요?"],
    want: ["지금 하고 싶은 반응", "", "솔직히 지금 당장 하고 싶은 말이나 행동"]
  },
  solo: {
    title: "지금 내 상태는 어떤가요?",
    situation: ["무슨 일, 어떤 상태", "일어난 일이나 요즘 상태를 그대로", "무엇이 마음에 걸리나요? 최근 잠, 식사, 컨디션도 적어주면 좋아요."],
    feeling: ["내 감정", "불안, 무기력, 조급함, 설렘도 괜찮아요", "불안, 초조, 무기력, 들뜸…"],
    guess: ["머릿속에 맴도는 생각", "떠오르는 문장 그대로", "예: 이러다 망한다, 이 기회 놓치면 끝이다"],
    want: ["내리려는 판단이나 하고 싶은 행동", "", "지금 하려는 결정이나 충동"]
  }
};
const currentMode = () => ($("#mode-solo").checked ? "solo" : "rel");
const presetsFor = m => (m === "solo" ? PRESETS_SOLO : PRESETS);
let showingExample = false;

function setMode(m) {
  $("#mode-" + m).checked = true;
  const t = MODE_TEXT[m];
  $("#form-title").textContent = t.title;
  for (const id of ["situation", "feeling", "guess", "want"]) {
    const [label, hint, ph] = t[id];
    $(`label[for="${id}"]`).replaceChildren(label, hint ? h("span", { class: "hint", text: " · " + hint }) : "");
    $("#" + id).placeholder = ph;
  }
  $("#rel-field").hidden = m === "solo";
  $("#presets").replaceChildren(...presetsFor(m).map(p => {
    const c = h("button", { class: "chip", type: "button", text: p.label });
    c.addEventListener("click", () => fillForm(p));
    return c;
  }));
}

function showExample(m) {
  if (m === "solo") renderResult(EXAMPLE_SOLO_RESULT, EXAMPLE_SOLO_INPUT, { example: true });
  else renderResult(EXAMPLE_RESULT, EXAMPLE_INPUT, { example: true });
}

/* 모드를 바꿀 때: 사용자가 쓴 글은 지키고, 예시 상태일 때만 예시를 바꿔 보여줌 */
function onModeChange() {
  const m = currentMode();
  setMode(m);
  const s = $("#situation").value.trim();
  const pristine = !s || [...PRESETS, ...PRESETS_SOLO].some(p => p.situation === s);
  if (pristine) fillForm(m === "solo" ? EXAMPLE_SOLO_INPUT : EXAMPLE_INPUT);
  if (showingExample) showExample(m);
}

function fillForm(p) {
  setMode(p.mode === "solo" ? "solo" : "rel");
  $("#rel").value = p.rel || "직원";
  $("#situation").value = p.situation || "";
  $("#feeling").value = p.feeling || "";
  $("#guess").value = p.guess || "";
  $("#want").value = p.want || "";
  $("#heat").value = p.heat || 3;
  updateHeat();
}
function updateHeat() { const v = Number($("#heat").value); $("#heat-out").textContent = `${v} · ${HEAT_LABEL[v]}`; }
function setView(v) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  $("#view-new").hidden = v !== "new";
  $("#view-hist").hidden = v !== "hist";
  $("#view-lib").hidden = v !== "lib";
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$("#heat").addEventListener("input", updateHeat);
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", onModeChange));
$("#form").addEventListener("submit", ev => {
  ev.preventDefault();
  const inp = readForm();
  if (!inp.situation) { $("#situation").focus(); return; }
  analyze(inp);
});

fillForm(EXAMPLE_INPUT);
showExample("rel");
renderLibrary();
store.listeners.push(renderHistory);
renderHistory([]);

(async () => {
  if (!window.claude) { noClaude(); store.mode = "local"; store.loadLocal(); return; }
  store.init();
  try { sampleFn = await claude.use("sample"); } catch { sampleFn = null; }
  if (!sampleFn) noClaude();
})();
function noClaude() {
  $("#go").disabled = true;
  const n = $("#avail-note");
  n.hidden = false;
  n.textContent = "이 화면에서는 분석을 쓸 수 없어요. claude.ai에 로그인한 상태로 이 페이지를 열어주세요.";
}
</script>
